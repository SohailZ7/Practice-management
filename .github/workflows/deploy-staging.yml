# Deploys main to STAGING after CI passes on that exact commit. Staging only: this file never touches production.
# Signs in with Workload Identity Federation (short-lived, no stored keys). The deploy identity exists only in the staging project.
# Environment variables and secrets already on the service are kept: no env flags are passed, so nothing is replaced
# (and never --set-env-vars). Schema changes are NOT applied here; they still go through the schema job before traffic.
name: Deploy staging

on:
  workflow_run:
    workflows: ["SaaS app CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer main commit waits instead of racing.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PROJECT: bbc-practice-mgmt-staging
  REGION: us-east4
  SERVICE: practice-mgmt
  REPO: us-east4-docker.pkg.dev/bbc-practice-mgmt-staging/cloud-run-source-deploy
  IMAGE_NAME: practice-mgmt

jobs:
  deploy:
    name: build, deploy no-traffic, smoke test, move traffic
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact commit CI passed on (clean copy)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Short commit label
        run: echo "SHORT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/321509350517/locations/global/workloadIdentityPools/github/providers/github-main
          service_account: gh-deploy@bbc-practice-mgmt-staging.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        working-directory: "SaaS app"
        run: |
          gcloud auth configure-docker us-east4-docker.pkg.dev --quiet
          docker build -t "$REPO/$IMAGE_NAME:$SHORT" .
          docker push "$REPO/$IMAGE_NAME:$SHORT"
      - name: Deploy new revision with no traffic, labeled commit=<sha>
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$REPO/$IMAGE_NAME:$SHORT" \
            --no-traffic --tag "c$SHORT" \
            --update-labels "commit=$SHORT,env=staging" \
            --quiet
      - name: Smoke test the new revision (login page loads, security headers present)
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format='value(status.traffic[].url)' | tr ';' '\n' | grep "c$SHORT" | head -1)
          test -n "$URL"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/login")
          echo "login status $code"
          test "$code" = "200"
          curl -sI "$URL/login" | tr -d '\r' | grep -i '^content-security-policy:' >/dev/null
      - name: Move traffic to the new revision
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --to-latest --quiet
          echo "Staging now serves commit=$SHORT" >> "$GITHUB_STEP_SUMMARY"
