# Fixed project name: the folder name is not used, so the existing database volume (practice-management_pgdata) keeps working.
name: practice-management
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice
      POSTGRES_DB: practice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
